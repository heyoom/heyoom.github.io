#-------------------------------
# General Site Settings
baseURL = "https://moyorun.com/"
languageCode = "ko-kr"
title = "모요런"
theme = "coderon"
enableRobotsTXT = true
enableEmoji = true
googleAnalytics = "G-VKXN3PNDC0"

[params]
  description = "매일 달리고 기록합니다"
  mainSections = ["posts"]
  keywords = ["러닝", "마라톤", "달리기", "러너", "40대"]

# SEO 설정
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

#-------------------------------
# Color Scheme
[params.color_scheme]
  default = "dark"
  toggle = true

#-------------------------------
# Main Menu
[menu]
  [[menu.main]]
    name = "홈"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "러닝"
    url = "/categories/러닝/"
    weight = 2

  [[menu.main]]
    name = "일상"
    url = "/categories/일상/"
    weight = 3

  [[menu.main]]
    name = "정보"
    url = "/categories/정보/"
    weight = 4

  [[menu.main]]
    name = "보관함"
    url = "/archive/"
    weight = 5

  [[menu.main]]
    identifier = "more"
    name = "더보기"
    weight = 6

  [[menu.main]]
    name = "러닝 기록"
    url = "/running-history/"
    parent = "more"
    weight = 1

  [[menu.main]]
    name = "소개"
    url = "/about/"
    parent = "more"
    weight = 2

#-------------------------------
# Author Settings
[params.author]
  author_name = "모요!"
  author_avatar = "/images/profile.png"

#-------------------------------
# Hero Settings
[params.hero]
  enable = true
  hero_avatar = "/images/profile.png"
  hero_title = "모요런"
  hero_subtitle = "40대 러너"
  hero_description = "매일 달립니다. 매번 기록합니다."
  hero_image = "/images/hero.png"
  hero_image_caption = "중요한 건 기록이지. 기록 없으면 무슨 재미로 달리나"
  hero_button_text = "소개 보기"
  hero_button_link = "/about"

  # Marathon Personal Records
  [[params.hero.marathon_records]]
    distance = "10K"
    time = "00:45:19"
    event = "'25.10.26 부천마라톤"

  [[params.hero.marathon_records]]
    distance = "Half"
    time = "01:40:55"
    event = "'25.09.28 인천 송도국제마라톤"

  [[params.hero.marathon_records]]
    distance = "Full"
    time = "03:48:59"
    event = "'25.04.20 경기마라톤"

#-------------------------------
# Blog Section
[params.blog]
  enable = true
  blog_title = "최근 글"

#-------------------------------
# Pagination
[pagination]
  pagerSize = 10

#-------------------------------
# Other Features (비활성화)
[params.logos]
  enable = false

[params.tags_section]
  enable = false

[params.videos]
  enable = false

[params.gallery]
  enable = false

[params.mailchimp]
  enable = false

[params.disqus]
  enable = false

[params.giscus]
  enable = true

#-------------------------------
# Footer Settings
[params.footer]
  footer_description = "매일 달리고 기록합니다"

#-------------------------------
# Social Settings
[[params.social]]
  icon = "fa-brands fa-github"
  name = "Github"
  link = "https://github.com/heyoom"

[[params.social]]
  icon = "fa-solid fa-globe"
  name = "Website"
  link = "https://minorlab.com"

[[params.social]]
  icon = "fa-brands fa-strava"
  name = "Strava"
  link = "https://www.strava.com/athletes/94694989"

[[params.social]]
  icon = "fa-solid fa-chart-line"
  name = "Runalyze"
  link = "https://runalyze.com/athlete/heyoom"

#-------------------------------
# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"

#-------------------------------
# Markup
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.tableOfContents]
    startLevel = 1
    ordered = true
    endLevel = 3

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false

#-------------------------------
# Output Formats
[outputs]
  home = ["HTML", "RSS", "JSON"]
